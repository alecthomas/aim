on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
name: Release
jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # ratchet:cashapp/activate-hermit@v1
      - run: just release-notes > release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build:
    name: Build ${{ matrix.arch }}-${{ matrix.target-suffix }}
    needs: [create-release]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target-suffix: unknown-linux-gnu
          - os: ubuntu-24.04-arm
            arch: aarch64
            target-suffix: unknown-linux-gnu
          - os: macos-latest
            arch: x86_64
            target-suffix: apple-darwin
          - os: macos-latest
            arch: aarch64
            target-suffix: apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # ratchet:cashapp/activate-hermit@v1
        with:
          cache: true
      - id: update-version
        run: sed -i'' -e "s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" Cargo.toml
      - id: build
        shell: bash
        run: |
          export TARGET="${{ matrix.arch }}-${{ matrix.target-suffix }}"
          rustup target add "${TARGET}"
          cargo build --release --target "${TARGET}"
          export TARGET_PATH="target/${TARGET}/release/aim-${TARGET}"
          mv "target/${TARGET}"/release/aim "${TARGET_PATH}"
          bzip2 -f9 "${TARGET_PATH}"
          echo "TARGET_PATH=${TARGET_PATH}.bz2" >> "$GITHUB_OUTPUT"
      - run: gh release upload "${GITHUB_REF_NAME}" "${{ steps.build.outputs.TARGET_PATH }}" --repo "${GITHUB_REPOSITORY}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - shell: bash
        run: |
          assets="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | sort)"
          expected=(
            aim-x86_64-unknown-linux-gnu.bz2
            aim-aarch64-unknown-linux-gnu.bz2
            aim-x86_64-apple-darwin.bz2
            aim-aarch64-apple-darwin.bz2
          )
          expected_assets="$(printf "%s\n" "${expected[@]}" | sort)"
          if [[ "${assets}" != "${expected_assets}" ]]; then
            echo "Release asset set does not match expected assets" >&2
            diff -u <(printf "%s\n" "${expected_assets}") <(printf "%s\n" "${assets}") >&2 || true
            exit 1
          fi
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  cleanup-release:
    name: Cleanup draft release
    if: ${{ always() && (failure() || cancelled()) }}
    runs-on: ubuntu-latest
    needs: [create-release, build, publish-release]
    permissions:
      contents: write
    steps:
      - shell: bash
        run: |
          draft="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ "${draft}" == "true" ]]; then
            gh release delete "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag=false
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
