[package]
name = "aim"
version = "0.1.0"
edition = "2024"

[dependencies]
# Not used directly. rig-bedrock builds aws-config with default features off,
# which omits the `credential_process` and SSO credential providers. AWS
# profiles that resolve credentials via an external process or AWS IAM Identity
# Center (SSO) need these, so we re-enable the features here; Cargo unifies them
# onto the aws-config that rig-bedrock uses.
aws-config = { version = "1.8", default-features = false, features = ["credentials-process", "sso"] }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.5.2"
dirs = "6"
futures = "0.3"
libc = "0.2"
open = "5"
rig = { package = "rig-core", version = "0.38.1" }
rig-bedrock = "0.38.1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
schemars = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
similar = "2.7.0"
sqlparser = "0.61.0"
syntect = "5.3.0"
tokio = { version = "1.50.0", features = ["full"] }
toml = "1.1.0"
yansi = { version = "1.0.1", features = ["detect-tty", "detect-env"] }

[dev-dependencies]
tempfile = "3.27.0"
